services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codice_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codice_secret}
      POSTGRES_DB: ${POSTGRES_DB:-codice_db}
    # No published ports: only the backend and worker, on this Compose network,
    # reach the database.
    volumes:
      - codice_pgdata:/var/lib/postgresql/data
    networks:
      - codice_network
    restart: unless-stopped

  # 2. Redis Queue & PubSub
  redis:
    image: redis:7-alpine
    container_name: codice_redis
    # Authentication is mandatory. Use a URL-safe value (for example
    # `openssl rand -hex 24`), because it is embedded in REDIS_URL below.
    # No published ports: only the backend and worker reach the queue.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    networks:
      - codice_network
    restart: unless-stopped

  # 3. Go API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codice_backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-codice_user}:${POSTGRES_PASSWORD:-codice_secret}@postgres:5432/${POSTGRES_DB:-codice_db}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      CODICE_STORAGE_PATH: /app/storage
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PORT: "8080"
      # LDAP sign-in (optional). Leave LDAP_URL empty to keep it off; see the README.
      # The service account's password is read from a file, never from the environment.
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD_FILE: ${LDAP_BIND_PASSWORD_FILE:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_USERNAME_ATTR: ${LDAP_USERNAME_ATTR:-}
      LDAP_ID_ATTR: ${LDAP_ID_ATTR:-}
      LDAP_EMAIL_ATTR: ${LDAP_EMAIL_ATTR:-}
      LDAP_START_TLS: ${LDAP_START_TLS:-}
      LDAP_CA_FILE: ${LDAP_CA_FILE:-}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/storage
      # Secrets and the CA certificate for LDAP live in ./ldap (not in git).
      - ./ldap:/app/ldap:ro
    depends_on:
      - postgres
      - redis
    networks:
      - codice_network
    restart: unless-stopped

  # Optional: the Authentik LDAP outpost, on the same private network as the API.
  # Start it with `docker compose -f docker-compose.full.yml --profile ldap up -d`.
  # It publishes no port: only the backend can reach it, as ldap-outpost:6636.
  ldap-outpost:
    # AUTHENTIK_TAG must be your Authentik version. It is only needed with the ldap profile,
    # and compose reads it even when the profile is off, so it has a self-explaining placeholder
    # instead of being required: pulling the placeholder fails and names the variable.
    image: ghcr.io/goauthentik/ldap:${AUTHENTIK_TAG:-set-AUTHENTIK_TAG}
    profiles: ["ldap"]
    container_name: codice_ldap_outpost
    env_file: ./ldap/outpost.env
    networks:
      - codice_network
    restart: unless-stopped

  # 4. Asynchronous Python Worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: codice_worker
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-codice_user}:${POSTGRES_PASSWORD:-codice_secret}@postgres:5432/${POSTGRES_DB:-codice_db}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      CODICE_STORAGE_PATH: /app/storage
    volumes:
      - ./uploads:/app/storage
    depends_on:
      - postgres
      - redis
    networks:
      - codice_network
    restart: unless-stopped

  # 5. React Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codice_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - codice_network
    restart: unless-stopped

networks:
  codice_network:
    driver: bridge

volumes:
  codice_pgdata: