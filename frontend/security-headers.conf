# Sent with every answer of this server (included in each location: nginx drops the headers of
# the server block as soon as a location sets one of its own).
add_header X-Content-Type-Options "nosniff" always;
# Links of the app carry short-lived tokens in the query (?rt=): none of that goes to another site.
add_header Referrer-Policy "same-origin" always;
# The app is not to be framed by another site (clickjacking); the CSP says it too, for browsers that read it.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
