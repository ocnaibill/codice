# The app is a single page served at "/" (its links use query strings, not paths), so
# only "/", the built assets and two root files are static. EVERYTHING ELSE goes to the
# API. That keeps this file from going stale when the API gains a route.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Uploads can be large; the API enforces CODICE_MAX_UPLOAD_MB itself.
    client_max_body_size 0;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # The PDF reader loads its worker as a module (.mjs). The stock mime.types does not know
    # the extension, so it would go out as application/octet-stream, and the browser refuses to
    # run a module with that type: PDFs would not open. (A regex location wins over /assets/.)
    location ~ ^/assets/.+\.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(favicon\.svg|icons\.svg)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # WebSocket for live updates.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Appended, not replaced: the client address is the first one nobody trusted, read
        # from the right, so a header the client sent cannot be forged into the answer.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Files and pages stream straight through (ranges, audio, long imports).
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
