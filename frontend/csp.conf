# The policy of the page (DEC: security pass of 2026-10-04). It is sent with the HTML document, which is what the
# browser enforces for the page, its scripts and the frames the reader opens.
#
# script-src is 'self' alone: no inline script, no eval. A book, a note or a name that gets into the page as markup cannot run
# anything, and the page can only load scripts that this server itself serves.
# style-src has 'unsafe-inline' because React sets styles on elements and the readers write their own into the book's frame;
# a style cannot run code. blob: and data: are the pages and covers the readers make in the browser.
# connect-src names the websocket of this host explicitly, since not every browser counts it as 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws://$http_host wss://$http_host; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
