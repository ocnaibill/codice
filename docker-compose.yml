version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codice_db
    environment:
      POSTGRES_USER: codice_user
      POSTGRES_PASSWORD: codice_secret
      POSTGRES_DB: codice_db
    volumes:
      - codice_pgdata:/var/lib/postgresql/data
    networks:
      - codice_network
    restart: unless-stopped

  # 2. Redis Queue & PubSub
  redis:
    image: redis:7-alpine
    container_name: codice_redis
    networks:
      - codice_network
    restart: unless-stopped

  # 3. Go API Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: codice_backend
    environment:
      - DATABASE_URL=postgres://codice_user:codice_secret@postgres:5432/codice_db?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CODICE_STORAGE_PATH=/app/storage
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/storage
    depends_on:
      - postgres
      - redis
    networks:
      - codice_network
    restart: unless-stopped

  # 4. Asynchronous Python Worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: codice_worker
    environment:
      - DATABASE_URL=postgres://codice_user:codice_secret@postgres:5432/codice_db?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CODICE_STORAGE_PATH=/app/storage
    volumes:
      - ./uploads:/app/storage
    depends_on:
      - postgres
      - redis
    networks:
      - codice_network
    restart: unless-stopped

  # 5. React Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codice_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - codice_network
    restart: unless-stopped

networks:
  codice_network:
    driver: bridge

volumes:
  codice_pgdata: